name: GTAConverter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
targets:
  GTAConverter:
    type: application
    platform: iOS
    sources:
      - GTAConverter
      - RPFStudio/RPFStudioView.swift
      - RPFStudio/PythonRuntime.swift
      - RPFStudio/RPFPythonBridge.m
    resources:
      - path: GTAConverter/Resources
    dependencies:
      - package: libarchive-for-swift
        product: SwiftArchive
      - framework: vendor/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gta-converter
        PRODUCT_NAME: INRPF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Classic AppIcon-Cyber AppIcon-Carbon AppIcon-Gold"
        CURRENT_PROJECT_VERSION: "69"
        VERSIONING_SYSTEM: apple-generic
        PRODUCT_BUNDLE_VERSION: "69"
        MARKETING_VERSION: "5.34"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "INRPF"
        INFOPLIST_KEY_CFBundleVersion: "69"
        INFOPLIST_KEY_CFBundleShortVersionString: "5.34"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "يحتاج INRPF إلى الوصول للشبكة المحلية للاتصال بجهاز PS4 ونقل ملفات DLC عبر FTP."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/GTAConverter/GTAConverter-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/GTAConverter $(SRCROOT)/RPFStudio $(SRCROOT)/vendor/Python.xcframework/ios-arm64/Python.framework/Headers"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/rust/ios"
        OTHER_LDFLAGS: "$(inherited) -lgta_local_engine"
    postBuildScripts:
      - name: Stage Python runtime and RPF engine
        script: |
          set -euo pipefail
          RESOURCES_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RESOURCES_DIR"
          ditto "$SRCROOT/RPFStudio/Resources/engine" "$RESOURCES_DIR/engine"
          PYTHON_SLICE="$SRCROOT/vendor/Python-ios-slice"
          test -d "$PYTHON_SLICE/lib-arm64"
          mkdir -p "$RESOURCES_DIR/python"
          rsync -a --exclude "Python.framework" --exclude "platform-config" "$PYTHON_SLICE/lib-arm64/" "$RESOURCES_DIR/python/"

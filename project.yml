name: GTAConverter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp.git
    revision: 0afc721b11e24c619229ee191edd7c5fde003b9c
targets:
  GTAConverter:
    type: application
    platform: iOS
    sources:
      - GTAConverter
    resources:
      - path: GTAConverter/Resources
    dependencies:
      - package: libarchive-for-swift
        product: SwiftArchive
      - package: SwiftLlama
        product: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gta-converter
        PRODUCT_NAME: INRPF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "34"
        VERSIONING_SYSTEM: apple-generic
        PRODUCT_BUNDLE_VERSION: "34"
        MARKETING_VERSION: "3.30"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "INRPF"
        INFOPLIST_KEY_CFBundleVersion: "34"
        INFOPLIST_KEY_CFBundleShortVersionString: "3.30"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "يحتاج INRPF إلى الوصول للشبكة المحلية للاتصال بجهاز PS4 ونقل ملفات DLC عبر FTP."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/GTAConverter/GTAConverter-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/GTAConverter"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/rust/ios"
        OTHER_LDFLAGS: "$(inherited) -lgta_local_engine"

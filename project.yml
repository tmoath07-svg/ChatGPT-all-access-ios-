name: GTAConverter
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
targets:
  GTAConverter:
    type: application
    platform: iOS
    sources:
      - GTAConverter
    dependencies:
      - package: libarchive-for-swift
        product: SwiftArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gta-converter
        PRODUCT_NAME: GTA Converter
        PRODUCT_BUNDLE_VERSION: "2"
        MARKETING_VERSION: "1.1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "GTA Converter"
        INFOPLIST_KEY_CFBundleVersion: "2"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.1.0"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  RPFStudio:
    type: application
    platform: iOS
    sources:
      - RPFStudio
    dependencies:
      - framework: vendor/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.rpfstudio
        PRODUCT_NAME: RPF Studio
        PRODUCT_BUNDLE_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: RPFStudio/RPFStudio-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/vendor/Python.xcframework/ios-arm64/Python.framework/Headers"
        INFOPLIST_KEY_CFBundleDisplayName: "RPF Studio"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    postBuildScripts:
      - name: Stage Python runtime resources
        script: |
          set -euo pipefail
          RESOURCES_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RESOURCES_DIR"
          ditto "$SRCROOT/RPFStudio/Resources/engine" "$RESOURCES_DIR/engine"
          PYTHON_SLICE="$SRCROOT/vendor/Python-ios-slice"
          test -d "$PYTHON_SLICE/lib-arm64"
          mkdir -p "$RESOURCES_DIR/python"
          rsync -a --exclude "Python.framework" --exclude "platform-config" "$PYTHON_SLICE/lib-arm64/" "$RESOURCES_DIR/python/"

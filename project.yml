name: GTAConverter
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
targets:
  GTAConverter:
    type: application
    platform: iOS
    sources:
      - GTAConverter
    dependencies:
      - package: libarchive-for-swift
        product: SwiftArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gta-converter
        PRODUCT_NAME: GTA Converter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_VERSION: "12"
        MARKETING_VERSION: "1.5.2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "GTA Converter"
        INFOPLIST_KEY_CFBundleVersion: "12"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.5.2"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

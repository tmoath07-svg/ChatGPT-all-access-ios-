name: GTAConverter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
targets:
  GTAConverter:
    type: application
    platform: iOS
    sources:
      - AIProviderCore.swift
      - AppFileDetailView.swift
      - AutonomousAgentCore.swift
      - AutonomousAgentView.swift
      - ContentView.swift
      - DLCPS4PreparationView.swift
      - DLClistEditorView.swift
      - DeviceTestCore.swift
      - DeviceTestLabView.swift
      - DiagnosticsView.swift
      - ExtraViews.swift
      - FTPBrowserView.swift
      - FTPDirectoryUploadPlanner.swift
      - FeatureAnalysisCore.swift
      - FeatureAnalysisViews.swift
      - FileImportService.swift
      - FiveMStudioView.swift
      - GTAConverterApp.swift
      - GTAModSuiteViews.swift
      - GTAOnboardingView.swift
      - GeminiToolView.swift
      - GitHubIntegrationView.swift
      - INRPFBackgroundTransferManager.swift
      - INRPFDisplaySurveyView.swift
      - INRPFPhoneRootView.swift
      - INRPFDocumentPicker.swift
      - INRPFReportClient.swift
      - LocalEngineBridge.swift
      - LocalEngineView.swift
      - LocalModLibraryView.swift
      - LocalTimelineView.swift
      - LocalUtilityCore.swift
      - LocalUtilityFeatureView.swift
      - ModAnalyzer.swift
      - OrbxAutoInstallPlanner.swift
      - OrbxPS4TransferView.swift
      - PremiumLicenseClient.swift
      - VehicleModelInspectorView.swift
      - YTDTextureLabView.swift
    resources:
      - Assets.xcassets
      - en.lproj
    dependencies:
      - package: libarchive-for-swift
        product: SwiftArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gta-converter
        PRODUCT_NAME: INRPF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "80"
        VERSIONING_SYSTEM: apple-generic
        PRODUCT_BUNDLE_VERSION: "80"
        MARKETING_VERSION: "6.10"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "INRPF"
        INFOPLIST_KEY_CFBundleVersion: "80"
        INFOPLIST_KEY_CFBundleShortVersionString: "6.10"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "يحتاج INRPF إلى الوصول للشبكة المحلية للاتصال بجهاز PS4 ونقل الملفات عبر FTP."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/GTAConverter-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/rust/ios"
        OTHER_LDFLAGS: "$(inherited) -lgta_local_engine"

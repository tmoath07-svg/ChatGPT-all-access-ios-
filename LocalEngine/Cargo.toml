[package]
name = "gta-local-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "gta_local_engine"
crate-type = ["staticlib"]

[dependencies]
rpf-archive = "0.10.0"
rage-formats = { version = "0.5.1", default-features = false, features = ["encode"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }
serde_json = "1.0"
flate2 = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: Test INRPF Server

on:
  push:
    branches: [main, fix/gemini-ios-layout-6.10]
    paths:
      - "server/**"
      - ".github/workflows/test-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
      - name: Run licensing and Gemini proxy tests
        run: |
          set -euo pipefail
          cd server
          python -m unittest -v test_license_api.py test_gemini_proxy.py
          python -m py_compile app.py test_license_api.py test_gemini_proxy.py

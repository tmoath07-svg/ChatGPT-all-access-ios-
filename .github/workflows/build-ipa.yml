name: Build GTA Converter IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages and patch SwiftArchive language mode
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -derivedDataPath build/DerivedData
          PACKAGE_MANIFEST="build/DerivedData/SourcePackages/checkouts/libarchive-for-swift/Package.swift"
          if [ ! -f "$PACKAGE_MANIFEST" ]; then
            echo "SwiftArchive Package.swift was not found in the build's DerivedData checkout."
            exit 1
          fi
          echo "Patching SwiftArchive manifest used by the build: $PACKAGE_MANIFEST"
          python3 - "$PACKAGE_MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          import os
          path = Path(sys.argv[1])
          os.chmod(path, 0o644)
          source = path.read_text()
          if "swiftLanguageModes: [.v6]" not in source:
              raise SystemExit("Expected SwiftArchive Swift 6 language mode was not found; refusing an unsafe blind patch.")
          path.write_text(source.replace("swiftLanguageModes: [.v6]", "swiftLanguageModes: [.v5]", 1))
          print("SwiftArchive language mode changed to Swift 5 in the exact checkout used by xcodebuild.")
          PY

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/GTA Converter.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GTA-Converter-unsigned.ipa Payload

          unzip -t GTA-Converter-unsigned.ipa
          INFO="Payload/GTA Converter.app/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")

          test "$BUNDLE_ID" = "com.tmoath07.gta-converter"
          test -n "$VERSION"
          test -x "Payload/GTA Converter.app/$EXECUTABLE"

          echo "IPA package: valid"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION"
          echo "Executable: $EXECUTABLE"
          echo "NOTE: This IPA is unsigned and must be signed by SideStore/AltStore or a valid Apple signing service before installation."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Converter-IPA-Unsigned
          path: GTA-Converter-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

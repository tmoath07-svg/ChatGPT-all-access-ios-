name: Build INRPF IPA

on:
  push:
    branches: [main, fix/import-drop-redesign, feature/local-engine-ios, feature/import-ftp-folder-fix, merge/inrpf-studio-unified]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-converter-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python 3.14 runtime for iOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/python
          curl -fL --retry 3 \
            https://github.com/beeware/Python-Apple-support/releases/download/3.14-b10/Python-3.14-iOS-support.b10.tar.gz \
            -o /tmp/python-ios.tar.gz
          tar -xzf /tmp/python-ios.tar.gz -C vendor/python
          XCFRAMEWORK="$(find vendor/python -type d -name Python.xcframework -print -quit)"
          test -n "$XCFRAMEWORK"
          ditto "$XCFRAMEWORK" vendor/Python.xcframework
          DEVICE_SLICE="$(find vendor/Python.xcframework -mindepth 1 -maxdepth 1 -type d -name 'ios-arm64' -print -quit)"
          test -n "$DEVICE_SLICE"
          ditto "$DEVICE_SLICE" vendor/Python-ios-slice
          test -d vendor/Python.xcframework
          test -d vendor/Python-ios-slice/lib-arm64
          python3 -m py_compile RPFStudio/Resources/engine/rpf_inspect.py

      - name: Generate app icon
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          python scripts/generate_app_icon.py

      - name: Install Rust toolchain for iOS
        run: |
          set -euo pipefail
          rustup show
          rustup target add aarch64-apple-ios
          cargo --version
          rustc --version

      - name: Test local engine on build host
        run: cargo test --manifest-path LocalEngine/Cargo.toml --release

      - name: Test FiveM resource analyzer
        run: |
          set -euo pipefail
          swiftc GTAConverter/ModAnalyzer.swift Tests/fivem_mod_analyzer_tests.swift -o /tmp/fivem-mod-analyzer-tests
          /tmp/fivem-mod-analyzer-tests
          grep -q 'MARKETING_VERSION: "5.36"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "71"' project.yml
          grep -Fq 'RPFStudioView()' GTAConverter/ContentView.swift
          grep -Fq '#include "RPFPythonBridge.h"' GTAConverter/GTAConverter-Bridging-Header.h
          grep -Fq 'RPFRunPythonScript' RPFStudio/RPFPythonBridge.h
          grep -Fq 'Python.xcframework' project.yml
          grep -Fq '.fileImporter(' RPFStudio/RPFStudioView.swift
          swiftc -typecheck GTAConverter/FileImportService.swift
          grep -Fq 'startAccessingSecurityScopedResource' GTAConverter/FileImportService.swift
          grep -Fq 'NSFileCoordinator' GTAConverter/FileImportService.swift
          grep -Fq 'FileImportService.importItem(' RPFStudio/RPFStudioView.swift
          grep -Fq 'category: "RPFStudio"' RPFStudio/RPFStudioView.swift
          grep -Fq 'scopeStarted = source.startAccessingSecurityScopedResource()' RPFStudio/RPFStudioView.swift
          grep -Fq 'securityScopeAlreadyStarted: scopeStarted' RPFStudio/RPFStudioView.swift
          grep -Fq 'allowedContentTypes: [UTType(filenameExtension: "rpf", conformingTo: .data) ?? .data, .data]' RPFStudio/RPFStudioView.swift
          grep -Fq '.fileImporter(' RPFStudio/RPFStudioView.swift
          grep -Fq 'if section == "menu"' GTAConverter/ContentView.swift
          grep -Fq 'if id == "rpf"' GTAConverter/ContentView.swift
          if grep -q 'UIDocumentPickerViewController' GTAConverter/ContentView.swift GTAConverter/FileImportService.swift; then
            echo "Legacy UIKit document picker reference remains."
            exit 1
          fi
          if grep -R -q 'INRPFDocumentPickerPresenter' GTAConverter; then
            echo "Legacy INRPF document picker presenter remains."
            exit 1
          fi

      - name: Test feature analysis core
        run: |
          set -euo pipefail
          swiftc GTAConverter/FeatureAnalysisCore.swift Tests/feature_analysis_tests.swift -o /tmp/feature-analysis-tests
          /tmp/feature-analysis-tests

      - name: Test INRPF device test core
        run: |
          set -euo pipefail
          swiftc GTAConverter/DeviceTestCore.swift Tests/device_test_core_tests.swift -o /tmp/inrpf-device-test-core
          /tmp/inrpf-device-test-core

      - name: Test local utility core
        run: |
          set -euo pipefail
          swiftc GTAConverter/ModAnalyzer.swift GTAConverter/LocalUtilityCore.swift Tests/local_utility_tests.swift -o /tmp/local-utility-tests
          /tmp/local-utility-tests

      - name: Test FTP directory upload planner
        run: |
          set -euo pipefail
          swiftc GTAConverter/FTPDirectoryUploadPlanner.swift Tests/ftp_directory_upload_tests.swift -o /tmp/ftp-directory-tests
          /tmp/ftp-directory-tests

      - name: Test Orbx auto installer with local DLC fixture
        run: |
          set -euo pipefail
          swiftc GTAConverter/OrbxAutoInstallPlanner.swift Tests/orbx_auto_install_tests.swift -o /tmp/orbx-auto-install-tests
          /tmp/orbx-auto-install-tests


      - name: Build static local engine for iOS ARM64
        run: |
          set -euo pipefail
          cargo build --manifest-path LocalEngine/Cargo.toml --release --target aarch64-apple-ios
          mkdir -p build/rust/ios
          cp LocalEngine/target/aarch64-apple-ios/release/libgta_local_engine.a build/rust/ios/
          test -s build/rust/ios/libgta_local_engine.a
          file build/rust/ios/libgta_local_engine.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages and patch SwiftArchive language mode
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -derivedDataPath build/DerivedData
          PACKAGE_MANIFEST="build/DerivedData/SourcePackages/checkouts/libarchive-for-swift/Package.swift"
          if [ ! -f "$PACKAGE_MANIFEST" ]; then
            echo "SwiftArchive Package.swift was not found in the build's DerivedData checkout."
            exit 1
          fi
          echo "Patching SwiftArchive manifest used by the build: $PACKAGE_MANIFEST"
          python3 - "$PACKAGE_MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          import os
          path = Path(sys.argv[1])
          os.chmod(path, 0o644)
          source = path.read_text()
          if "swiftLanguageModes: [.v6]" not in source:
              raise SystemExit("Expected SwiftArchive Swift 6 language mode was not found; refusing an unsafe blind patch.")
          path.write_text(source.replace("swiftLanguageModes: [.v6]", "swiftLanguageModes: [.v5]", 1))
          print("SwiftArchive language mode changed to Swift 5 in the exact checkout used by the build.")
          PY

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/INRPF.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -d "$APP_PATH/Frameworks/Python.framework"
          test -d "$APP_PATH/python"
          test -f "$APP_PATH/engine/rpf_inspect.py"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          INFO="Payload/INRPF.app/Info.plist"
          # XcodeGen may omit version keys from the generated plist on some runner/Xcode combinations.
          # Register common mod/archive file types so Files can offer Open In > INRPF.
          python3 - "$INFO" <<'PY'
          import plistlib, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              info = plistlib.load(stream)
          info["UTExportedTypeDeclarations"] = [{
              "UTTypeIdentifier": "com.tmoath07.rpf-archive",
              "UTTypeDescription": "GTA V RPF Archive",
              "UTTypeConformsTo": ["public.data"],
              "UTTypeTagSpecification": {"public.filename-extension": ["rpf"]}
          }]
          info["CFBundleDocumentTypes"] = [{
              "CFBundleTypeName": "INRPF Mod and RPF Archive",
              "CFBundleTypeRole": "Editor",
              "LSHandlerRank": "Owner",
              "LSItemContentTypes": [
                  "com.tmoath07.rpf-archive",
                  "public.data",
                  "public.archive",
                  "public.zip-archive",
                  "com.rarlab.rar-archive"
              ]
          }]
          with path.open("wb") as stream:
              plistlib.dump(info, stream, sort_keys=False)
          print("Registered Files/Open In document types.")
          PY
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.tmoath07.gta-converter' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.tmoath07.gta-converter' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 5.36' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 5.36' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 71' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 71' "$INFO"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")

          test "$BUNDLE_ID" = "com.tmoath07.gta-converter"
          test "$VERSION" = "5.36"
          test "$BUILD" = "71"
          /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$INFO" | grep -q 'rpf'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' "$INFO" | grep -q 'com.tmoath07.rpf-archive'
          grep -q 'MARKETING_VERSION: "5.36"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "71"' project.yml
          zip -qry INRPF-5.36-unsigned.ipa Payload
          unzip -t INRPF-5.36-unsigned.ipa
          test -x "Payload/INRPF.app/$EXECUTABLE"
          nm -g "Payload/INRPF.app/$EXECUTABLE" > build/exported-symbols.txt
          grep -q "_gta_engine_build_rpf7" build/exported-symbols.txt
          grep -q "_gta_engine_convert_and_build_rpf" build/exported-symbols.txt
          grep -q "_gta_engine_convert_folder" build/exported-symbols.txt
          grep -q "_gta_engine_extract_ytd" build/exported-symbols.txt
          grep -q "_gta_engine_build_ytd" build/exported-symbols.txt
          grep -q "_gta_engine_convert_fivem_resource" build/exported-symbols.txt
          grep -Fq 'int RPFRunPythonScript(' RPFStudio/RPFPythonBridge.h
          grep -Fq 'RPFRunPythonScript(' RPFStudio/RPFPythonBridge.m

          mkdir -p release-package
          cp INRPF-5.36-unsigned.ipa release-package/INRPF-5.36-unsigned.ipa
          cat > release-package/اقرأ-أولاً.txt <<'EOF'
          INRPF 5.36 - IPA غير موقّع

          1) فك ضغط ملف GitHub Actions الذي تم تنزيله.
          2) استخرج ملف INRPF-5.36-unsigned.ipa.
          3) ثبّت ملف IPA باستخدام SideStore بعد توقيعه.

          يتضمن هذا الإصدار INRPF مع RPF Studio المدمج وPython 3.14، مع تسجيل امتداد .rpf لنظام الملفات. فاحص RPF الحالي يعرض معلومات الملف والترويسة والبصمة SHA256 فقط؛ لا يتضمن بعد استخراجاً عاماً أو إعادة بناء لأرشيف RPF.
          تنبيه: هذا لا يعني أن OTD أو DLC الناتج متوافق مع PS4 حتى تكتمل اختبارات الموارد.
          EOF
          echo "IPA package: valid"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Executable: $EXECUTABLE"
          echo "NOTE: This IPA is unsigned and must be signed by SideStore/AltStore or a valid Apple signing service before installation."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: INRPF-5.36-Install-Package
          path: release-package/
          if-no-files-found: error
          retention-days: 14

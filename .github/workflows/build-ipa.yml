name: Build INRPF IPA

on:
  push:
    branches: [main, fix/import-drop-redesign, feature/local-engine-ios, feature/import-ftp-folder-fix, feature/inrpf-github-device-flow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-converter-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          python scripts/generate_app_icon.py

      - name: Install Rust toolchain for iOS
        run: |
          set -euo pipefail
          rustup show
          rustup target add aarch64-apple-ios
          rustup component add llvm-tools-preview
          cargo --version
          rustc --version

      - name: Test local engine on build host
        run: cargo test --manifest-path LocalEngine/Cargo.toml --release

      - name: Test FiveM resource analyzer
        run: |
          set -euo pipefail
          swiftc GTAConverter/ModAnalyzer.swift Tests/fivem_mod_analyzer_tests.swift -o /tmp/fivem-mod-analyzer-tests
          /tmp/fivem-mod-analyzer-tests
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path(".github/workflows/convert-pc-to-ps4.yml").read_text()
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "cat > toolkit/fivem_multi_vehicle_dlc.py <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "PY")
          source = textwrap.dedent("\n".join(lines[start + 1:end]) + "\n")
          compile(source, ".github/workflows/convert-pc-to-ps4.yml::fivem_multi_vehicle_dlc.py", "exec")
          assert "viable_candidates" in source or "viable" in source
          assert "[FiveM] SKIP" in source or "[FiveM] SKIPPED" in source
          print("FiveM multi-candidate workflow script: syntax OK")
          PY
          grep -q 'MARKETING_VERSION: "6.06"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "77"' project.yml
          ! grep -Fq '.fileImporter(' GTAConverter/ContentView.swift GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'activeImportPicker = .archive' GTAConverter/ContentView.swift
          grep -Fq 'activeImportPicker = .folder' GTAConverter/ContentView.swift
          grep -Fq '.inrpfDocumentPicker(' GTAConverter/ContentView.swift
          grep -Fq '.inrpfDocumentPicker(' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'UIDocumentPickerViewController' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'forOpeningContentTypes: contentTypes' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'allowsMultipleSelection: allowsMultipleSelection' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'asCopy: true' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'onCancellation()' GTAConverter/INRPFDocumentPicker.swift

      - name: Test GitHub start tab and preserved legacy workspace
        run: |
          set -euo pipefail
          grep -Fq 'TabView(selection: $selectedTab)' GTAConverter/GTAConverterApp.swift
          grep -Fq 'GitHubIntegrationView()' GTAConverter/GTAConverterApp.swift
          grep -Fq 'ContentView()' GTAConverter/GTAConverterApp.swift
          grep -Fq 'Label("GitHub"' GTAConverter/GTAConverterApp.swift
          grep -Fq 'Label("الأدوات"' GTAConverter/GTAConverterApp.swift
          grep -Fq 'selectedTab = 1' GTAConverter/GTAConverterApp.swift
          grep -Fq 'struct ContentView' GTAConverter/ContentView.swift
          test -s GTAConverter/ContentView.swift
          grep -Fq 'NavigationLink(destination: AppFilesView())' GTAConverter/ContentView.swift
          grep -Fq 'NavigationLink(destination: AppSettingsView())' GTAConverter/ContentView.swift
          grep -Fq 'NavigationLink(destination: AppDiagnosticsView' GTAConverter/ContentView.swift
          grep -Fq 'NavigationLink(destination: INRPFDeviceTestLabView())' GTAConverter/ContentView.swift
          grep -Fq 'NavigationLink(destination: INRPFDeviceTestLabView())' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'NavigationLink(destination: AppFilesView())' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'NavigationLink(destination: AppSettingsView())' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'NavigationLink(destination: OrbxPS4TransferView())' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'NavigationLink(destination: AppDiagnosticsView(sourceURL: nil' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'Button("رفع ملفات تشغيل المستودع")' GTAConverter/GitHubIntegrationView.swift
          ! grep -Fq 'Button("رفع جميع الملفات إلى Release")' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'https://github.com/signup' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'https://github.com/login/device/code' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'GHKeychain.save(token)' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'didConfirmGitHubSession' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'resolvedConversionMode' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'defaultBranch = "default_branch"' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'createInputRelease' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'uploadReleaseAsset' GTAConverter/GitHubIntegrationView.swift
          grep -Fq '"release_tag": tag' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'loadReleaseAssets' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'downloadReleaseAsset' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'Publish converted files to the input Release' .github/workflows/convert-pc-to-ps4.yml
          grep -Fq 'normalizePreparedDLC(at: root)' GTAConverter/ContentView.swift
          grep -Fq 'appendingPathComponent("data/orbx/gta/rpf/dlc_addon"' GTAConverter/DLCPS4PreparationView.swift
          grep -Fq 'gtaFolder.appendingPathComponent("dlclist.xml")' GTAConverter/DLCPS4PreparationView.swift
          grep -Fq 'copyItem(at: sourceFile, to: destination.appendingPathComponent("dlc.rpf"))' GTAConverter/DLCPS4PreparationView.swift
          grep -Fq '<Item>/data/orbx/gta/rpf/dlc_addon/' GTAConverter/DLCPS4PreparationView.swift
          grep -Fq 'dlc_addon/\\(name)/' GTAConverter/OrbxAutoInstallPlanner.swift
          grep -Fq '<Item>/data/orbx/gta/rpf/dlc_addon/' GTAConverter/OrbxAutoInstallPlanner.swift
          grep -Fq 'private let remoteRoot = "/data/orbx/gta/rpf"' GTAConverter/OrbxPS4TransferView.swift
          grep -Fq 'private let remoteDLClistDirectory = "/data/orbx/gta"' GTAConverter/OrbxPS4TransferView.swift
          grep -Fq 'appendingPathComponent("DLCLIST", isDirectory: true)' GTAConverter/ContentView.swift
          ! grep -Fq 'GTA-Prepared-' GTAConverter/ContentView.swift
          grep -Fq 'result/DLCLIST' .github/workflows/convert-pc-to-ps4.yml
          ! grep -Fq 'result/FiveM-PS4-DLC' .github/workflows/convert-pc-to-ps4.yml
          grep -Fq 'gh release download' .github/workflows/convert-pc-to-ps4.yml
          grep -Fq 'gh release upload' .github/workflows/convert-pc-to-ps4.yml
          grep -Fq 'contents: write' .github/workflows/convert-pc-to-ps4.yml
          grep -Fq 'conversionMode == "أوتو"' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'UNUserNotificationCenter' GTAConverter/GTAConverterApp.swift
          grep -Fq 'UNNotificationRequest' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'INRPFCompletionNotification.requestPermission' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'اكتمل تحويل INRPF بنجاح' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'تعذر إكمال تحويل INRPF' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'GHWorkflowRun' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'loadRuns(for repository: GHRepository)' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'client.loadRuns(for: repository)' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'PhotosPicker' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'activeSheet == .files' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'activeSheet == .folder' GTAConverter/GitHubIntegrationView.swift
          grep -Fq '.inrpfDocumentPicker(' GTAConverter/GitHubIntegrationView.swift
          grep -Fq '"/repos/tmoath07-svg/ChatGPT-all-access-ios-/contents/' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'for sourceRef in ["feature/inrpf-github-device-flow", "main"]' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'source.encoding == "base64"' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'GET /contents/{path} returns Base64 text' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'writeResult?.resolvedSHA' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'for attempt in 0..<5' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'await loadWorkflowSteps(for: repository, runID: latest.id)' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'مراحل التحويل' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'verified.content?.encoding == "base64"' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'actual != data' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'لم يتم العثور على Workflow في فرعي feature/inrpf-github-device-flow أو main' GTAConverter/GitHubIntegrationView.swift
          grep -Fq 'فشل رفع Workflow إلى' GTAConverter/GitHubIntegrationView.swift
          ! grep -Fq 'GTAOnboardingView' GTAConverter/ContentView.swift
          echo "PASS: GitHub is the start tab; all legacy toolbar destinations and native importers remain available."
      - name: Test shared file import service
        run: |
          set -euo pipefail
          swiftc GTAConverter/FileImportService.swift Tests/file_import_service_tests.swift -o /tmp/file-import-service-tests
          /tmp/file-import-service-tests

      - name: Test restored UIKit document picker coverage
        run: |
          set -euo pipefail
          test -s GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'UIDocumentPickerDelegate' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'UIDocumentPickerViewController' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'forOpeningContentTypes: contentTypes' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'asCopy: true' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'didPickDocumentsAt urls:' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'onCompletion(.success(urls))' GTAConverter/INRPFDocumentPicker.swift
          grep -Fq 'onCancellation()' GTAConverter/INRPFDocumentPicker.swift
          for file in ContentView.swift GitHubIntegrationView.swift DLClistEditorView.swift FeatureAnalysisViews.swift FiveMStudioView.swift LocalUtilityFeatureView.swift YTDTextureLabView.swift VehicleModelInspectorView.swift ExtraViews.swift FTPBrowserView.swift; do
            grep -Fq '.inrpfDocumentPicker(' "GTAConverter/$file"
          done
          echo "PASS: every file-import surface uses the restored UIKit document picker with provider copy."

      - name: Test feature analysis core
        run: |
          set -euo pipefail
          swiftc GTAConverter/FeatureAnalysisCore.swift Tests/feature_analysis_tests.swift -o /tmp/feature-analysis-tests
          /tmp/feature-analysis-tests

      - name: Test INRPF device test core
        run: |
          set -euo pipefail
          swiftc GTAConverter/DeviceTestCore.swift Tests/device_test_core_tests.swift -o /tmp/inrpf-device-test-core
          /tmp/inrpf-device-test-core

      - name: Test local utility core
        run: |
          set -euo pipefail
          swiftc GTAConverter/ModAnalyzer.swift GTAConverter/LocalUtilityCore.swift Tests/local_utility_tests.swift -o /tmp/local-utility-tests
          /tmp/local-utility-tests

      - name: Test FTP directory upload planner
        run: |
          set -euo pipefail
          swiftc GTAConverter/FTPDirectoryUploadPlanner.swift Tests/ftp_directory_upload_tests.swift -o /tmp/ftp-directory-tests
          /tmp/ftp-directory-tests

      - name: Test Orbx auto installer with local DLC fixture
        run: |
          set -euo pipefail
          swiftc GTAConverter/OrbxAutoInstallPlanner.swift Tests/orbx_auto_install_tests.swift -o /tmp/orbx-auto-install-tests
          /tmp/orbx-auto-install-tests


      - name: Build static local engine for iOS ARM64
        run: |
          set -euo pipefail
          cargo build --manifest-path LocalEngine/Cargo.toml --release --target aarch64-apple-ios
          mkdir -p build/rust/ios
          cp LocalEngine/target/aarch64-apple-ios/release/libgta_local_engine.a build/rust/ios/
          test -s build/rust/ios/libgta_local_engine.a
          file build/rust/ios/libgta_local_engine.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages and patch SwiftArchive language mode
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -derivedDataPath build/DerivedData
          PACKAGE_MANIFEST="build/DerivedData/SourcePackages/checkouts/libarchive-for-swift/Package.swift"
          if [ ! -f "$PACKAGE_MANIFEST" ]; then
            echo "SwiftArchive Package.swift was not found in the build's DerivedData checkout."
            exit 1
          fi
          echo "Patching SwiftArchive manifest used by the build: $PACKAGE_MANIFEST"
          python3 - "$PACKAGE_MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          import os
          path = Path(sys.argv[1])
          os.chmod(path, 0o644)
          source = path.read_text()
          if "swiftLanguageModes: [.v6]" not in source:
              raise SystemExit("Expected SwiftArchive Swift 6 language mode was not found; refusing an unsafe blind patch.")
          path.write_text(source.replace("swiftLanguageModes: [.v6]", "swiftLanguageModes: [.v5]", 1))
          print("SwiftArchive language mode changed to Swift 5 in the exact checkout used by the build.")
          PY

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project GTAConverter.xcodeproj \
            -scheme GTAConverter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/INRPF.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          INFO="Payload/INRPF.app/Info.plist"
          # XcodeGen may omit version keys from the generated plist on some runner/Xcode combinations.
          # Register common mod/archive file types so Files can offer Open In > INRPF.
          python3 - "$INFO" <<'PY'
          import plistlib, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              info = plistlib.load(stream)
          info["CFBundleDocumentTypes"] = [{
              "CFBundleTypeName": "INRPF Mod and Archive",
              "CFBundleTypeRole": "Editor",
              "LSHandlerRank": "Owner",
              "LSItemContentTypes": [
                  "public.archive",
                  "public.zip-archive",
                  "com.rarlab.rar-archive"
              ]
          }]
          with path.open("wb") as stream:
              plistlib.dump(info, stream, sort_keys=False)
          print("Registered Files/Open In document types.")
          PY
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.tmoath07.gta-converter' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.tmoath07.gta-converter' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 6.06' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 6.06' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 77' "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 77' "$INFO"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")

          test "$BUNDLE_ID" = "com.tmoath07.gta-converter"
          test "$VERSION" = "6.06"
          test "$BUILD" = "77"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' "$INFO" | grep -q 'public.archive'
          grep -q 'MARKETING_VERSION: "6.06"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "77"' project.yml
          zip -qry INRPF-6.06-unsigned.ipa Payload
          unzip -t INRPF-6.06-unsigned.ipa
          test -x "Payload/INRPF.app/$EXECUTABLE"
          # Validate exported C ABI symbols in the Rust static library itself.
          # The final Mach-O may dead-strip unreferenced public entry points.
          RUST_LLVM_TOOLS="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          LLVM_NM="$RUST_LLVM_TOOLS/llvm-nm"
          test -x "$LLVM_NM"
          "$LLVM_NM" --extern-only build/rust/ios/libgta_local_engine.a > build/exported-engine-symbols.txt
          for symbol in _gta_engine_build_rpf7 _gta_engine_convert_and_build_rpf _gta_engine_convert_folder _gta_engine_extract_ytd _gta_engine_build_ytd _gta_engine_convert_fivem_resource; do
            if ! grep -q "$symbol" build/exported-engine-symbols.txt; then
              echo "Missing required engine ABI symbol in static library: $symbol"
              grep -E 'gta_engine_' build/exported-engine-symbols.txt | head -80 || true
              exit 1
            fi
          done

          mkdir -p release-package
          cp INRPF-6.06-unsigned.ipa release-package/INRPF-6.06-unsigned.ipa
          cat > release-package/اقرأ-أولاً.txt <<'EOF'
          INRPF 6.06 - IPA غير موقّع

          1) فك ضغط ملف GitHub Actions الذي تم تنزيله.
          2) استخرج ملف INRPF-6.06-unsigned.ipa.
          3) ثبّت ملف IPA باستخدام SideStore بعد توقيعه.

          يتضمن هذا الإصدار محركاً محلياً لموارد المركبات، وفاحص RPF يعرض بيانات META الخاصة بالمركبات فقط، وتحليلاً وتحويلاً بنيوياً للموارد المدعومة، واستخراج وبناء قواميس YTD بصيغتها المدعومة. لا يتضمن استخراجاً عاماً لأرشيف RPF.
          تنبيه: هذا لا يعني أن OTD أو DLC الناتج متوافق مع PS4 حتى تكتمل اختبارات الموارد.
          EOF
          echo "IPA package: valid"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Executable: $EXECUTABLE"
          echo "NOTE: This IPA is unsigned and must be signed by SideStore/AltStore or a valid Apple signing service before installation."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: INRPF-6.06-Install-Package
          path: release-package/
          if-no-files-found: error
          retention-days: 14

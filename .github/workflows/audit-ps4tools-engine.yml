name: Audit Ps4tools Engine for iOS Porting

on:
  push:
    branches: [main, fix/import-drop-redesign]
    paths:
      - ".github/workflows/audit-ps4tools-engine.yml"
      - "GTAConverter/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout Ps4tools reference
        uses: actions/checkout@v4
        with:
          repository: tmoath07-svg/Ps4tools
          path: reference

      - name: Extract and audit conversion engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/source
          python - <<'PY'
          import ast, hashlib, json, re, shutil
          from pathlib import Path

          archive = Path("reference/ZokiiStudio-Toolkit-FIXED.zip")
          if not archive.is_file():
              raise SystemExit("Ps4tools toolkit ZIP was not found.")
          import zipfile
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Toolkit ZIP is corrupt at {bad}")
              z.extractall("audit-output/unpacked")

          root = Path("audit-output/unpacked")
          scripts = []
          patterns = {
              "windows_executables": r"(?i)\\.exe\\b|\\.dll\\b",
              "wine_or_windows_paths": r"(?i)\\bwine\\b|[A-Z]:\\\\|\\\\\\\\",
              "subprocess_calls": r"(?i)subprocess\\.|os\\.system|Popen\\(",
              "native_library_calls": r"(?i)ctypes|windll|WinDLL|CDLL",
              "archive_tools": r"(?i)7z|rarfile|zipfile|libarchive|RPFBuilder",
          }
          source_ext = {".py", ".lua", ".md", ".txt", ".json", ".xml", ".yml", ".yaml", ".bat", ".ps1"}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              raw = p.read_bytes()
              entry = {
                  "path": str(rel),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "extension": p.suffix.lower(),
              }
              if p.suffix.lower() == ".py":
                  text = raw.decode("utf-8", errors="replace")
                  try:
                      tree = ast.parse(text, filename=str(rel))
                      entry["syntax"] = "valid"
                      entry["imports"] = sorted({
                          (n.module or "") if isinstance(n, ast.ImportFrom) else alias.name
                          for n in ast.walk(tree) if isinstance(n, (ast.Import, ast.ImportFrom))
                          for alias in (n.names if isinstance(n, ast.Import) else [None])
                      })
                      entry["symbols"] = [
                          {"kind": type(n).__name__, "name": n.name, "line": n.lineno}
                          for n in ast.walk(tree)
                          if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                      ]
                  except SyntaxError as e:
                      entry["syntax"] = f"invalid: {e}"
                  entry["platform_markers"] = {
                      name: len(re.findall(pattern, text))
                      for name, pattern in patterns.items()
                  }
              scripts.append(entry)
              if p.suffix.lower() in source_ext:
                  target = Path("audit-output/source") / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, target)

          (Path("audit-output") / "engine-audit.json").write_text(
              json.dumps(scripts, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (Path("audit-output") / "README.txt").write_text(
              "Ps4tools source snapshot for GTA Converter iOS porting analysis.\\n"
              "The source files are copied from the reference repository toolkit ZIP.\\n"
              "No conversion binaries are executed during this audit.\\n",
              encoding="utf-8"
          )
          print(f"Audited {len(scripts)} toolkit files.")
          print(f"Exported {sum(1 for x in scripts if Path(x['path']).suffix.lower() in source_ext)} source/support files.")
          PY

      - name: Upload source and audit report
        uses: actions/upload-artifact@v4
        with:
          name: Ps4tools-iOS-Porting-Audit
          path: audit-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
